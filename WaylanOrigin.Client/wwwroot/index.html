    <style>
        .waylan-preloader {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #281A12 0%, #1A100A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #FAF6F0;
        }
        .preloader-content {
            text-align: center;
            max-width: 380px;
            padding: 40px 20px;
        }
        .preloader-logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
            animation: pulseLogo 2s ease-in-out infinite alternate;
        }
        .preloader-brand {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #B89A5E;
            margin: 0 0 6px 0;
        }
        .preloader-tagline {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #EDE4D9;
            opacity: 0.85;
            margin: 0 0 24px 0;
            text-transform: uppercase;
        }
        .preloader-progress-bar {
            width: 100%;
            height: 4px;
            background-color: rgba(184, 154, 94, 0.15);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .preloader-progress-fill {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, #B89A5E 0%, #D1B894 50%, #B89A5E 100%);
            border-radius: 4px;
            position: absolute;
            left: -45%;
            animation: loadingFill 1.6s ease-in-out infinite;
        }
        @keyframes pulseLogo {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 12px 24px rgba(184, 154, 94, 0.35)); }
        }
        @keyframes loadingFill {
            0% { left: -45%; width: 35%; }
            50% { width: 65%; }
            100% { left: 100%; width: 35%; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="waylan-preloader">
            <div class="preloader-content">
                <img src="logotipo/waylan.png" alt="Waylan Origin" class="preloader-logo" />
                <h2 class="preloader-brand">WAYLAN ORIGIN</h2>
                <p class="preloader-tagline">Café de Especialidad · Colombia</p>
                <div class="preloader-progress-bar">
                    <div class="preloader-progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        Ha ocurrido un evento inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script type="text/javascript" src="https://checkout.wompi.co/widget.js"></script>
    <script>
        window.lastWaylanActivityTime = Date.now();
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function(evt) {
            window.addEventListener(evt, function() {
                window.lastWaylanActivityTime = Date.now();
            }, { passive: true });
        });
        window.getWaylanInactivitySeconds = function() {
            return Math.floor((Date.now() - (window.lastWaylanActivityTime || Date.now())) / 1000);
        };

        window.abrirWidgetWompi = function (publicKey, reference, amountInCents, redirectUrl) {
            try {
                var checkout = new WidgetCheckout({
                    currency: 'COP',
                    amountInCents: amountInCents,
                    reference: reference,
                    publicKey: publicKey,
                    redirectUrl: redirectUrl
                });
                checkout.open(function (result) {
                    var transaction = result ? result.transaction : {};
                    var status = (transaction && transaction.status) ? transaction.status : 'APPROVED';
                    console.log('Transacción finalizada. ID: ', transaction ? transaction.id : 'N/A', ' Estado: ', status);
                    if (redirectUrl) {
                        var separator = redirectUrl.indexOf('?') !== -1 ? '&' : '?';
                        var targetUrl = redirectUrl + separator + 'status=' + encodeURIComponent(status) + '&ref=' + encodeURIComponent(reference || '');
                        window.location.href = targetUrl;
                    }
                });
            } catch (err) {
                console.error('Error al inicializar Widget Wompi:', err);
                if (redirectUrl) {
                    var separator = redirectUrl.indexOf('?') !== -1 ? '&' : '?';
                    window.location.href = redirectUrl + separator + 'status=PENDING&ref=' + encodeURIComponent(reference || '');
                }
            }
        };
    </script>
</body>

</html>
